<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet">
    <script defer src="script.js"></script>
    <title>Musical PC Keyboard</title>
</head>
<body>
    <div class="title">
        Musical Keyboard
    </div>
    <div class="keys">
        <button class="a key">C</button>
        <button class="s key">D</button>
        <button class="d key">E</button>
        <button class="f key">F</button>
        <button class="g key">G</button>
        <button class="h key">A</button>
        <button class="j key">B</button>
        <button class="k key">K</button>
    </div>
    <div class="footer">
        &copy; Copyright 2025 <a href="https://www.linkedin.com/feed/" target="_blank">Linkedln</a>
    </div>
    
</body>
</html>
